
name: Deploy Garden Planner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: community-garden-planner/client/package-lock.json

      - name: Install dependencies
        working-directory: community-garden-planner/client
        run: npm ci

      - name: Build website
        working-directory: community-garden-planner/client
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: community-garden-planner/client/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
